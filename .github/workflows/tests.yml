name: Backend integration tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aletheia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aletheia_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  compose:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: aletheia-ci
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: |
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/health/db
          curl --fail http://localhost:8000/health/redis
          docker compose exec -T backend python -m redis_connection
          docker compose exec -T backend python -m alembic current
          docker compose exec -T backend python -m alembic check
      - name: Verify browser session against running Backend
        run: |
          docker compose exec -T backend python - <<'PY'
          import asyncio
          import httpx
          from sqlalchemy.orm import Session
          from auth.session import COOKIE_NAME, SessionSettings, create_session, revoke_session
          from database import create_database_engine
          from models import Affiliation, User
          from redis_connection import create_redis_client

          async def provision(user_id):
              client = create_redis_client()
              try:
                  return await create_session(client, user_id, SessionSettings.from_environment())
              finally:
                  await client.aclose()

          async def revoke(token):
              client = create_redis_client()
              try:
                  await revoke_session(client, token)
              finally:
                  await client.aclose()

          engine = create_database_engine()
          token = None
          try:
              with Session(engine) as db:
                  user = User(email='session-smoke@example.edu', affiliation=Affiliation.STUDENT)
                  db.add(user)
                  db.commit()
                  user_id = user.id
              try:
                  token = asyncio.run(provision(user_id))
                  with httpx.Client(base_url='http://localhost:8000') as client:
                      client.cookies.set(COOKIE_NAME, token)
                      response = client.get('/auth/me')
                      assert response.status_code == 200
                      assert response.json()['user']['id'] == str(user_id)
                      response = client.post('/auth/logout', headers={'Origin': 'http://localhost:8000'})
                      assert response.status_code == 204
                      client.cookies.clear()
                      client.cookies.set(COOKIE_NAME, token)
                      assert client.get('/auth/me').status_code == 401
                  print('Browser session creation, authentication and revocation passed')
              finally:
                  if token:
                      asyncio.run(revoke(token))
                  with Session(engine) as db:
                      db.delete(db.get(User, user_id))
                      db.commit()
          finally:
              engine.dispose()
          PY
      - name: Verify database outage readiness
        run: |
          docker compose stop db
          test "$(curl -s -o /tmp/readiness.json -w '%{http_code}' http://localhost:8000/health/db)" = "503"
          curl --fail http://localhost:8000/health
          docker compose up -d --wait --wait-timeout 180
      - name: Verify Redis outage and recovery
        run: |
          docker compose exec -T redis redis-cli SET ci:transient-check temporary EX 60
          docker compose stop redis
          test "$(curl -s -o /tmp/redis-readiness.json -w '%{http_code}' http://localhost:8000/health/redis)" = "503"
          curl --fail http://localhost:8000/health
          docker compose up -d --wait --wait-timeout 180
          test "$(docker compose exec -T redis redis-cli EXISTS ci:transient-check)" = "0"
          curl --fail http://localhost:8000/health/redis
      - name: Verify persistent database volume
        run: |
          docker compose exec -T db psql -U aletheia -d aletheia -v ON_ERROR_STOP=1 -c "CREATE TABLE compose_smoke (value integer); INSERT INTO compose_smoke VALUES (42);"
          docker compose down
          docker compose up -d --wait --wait-timeout 180
          test "$(docker compose exec -T db psql -U aletheia -d aletheia -Atc 'SELECT value FROM compose_smoke')" = "42"
          curl --fail http://localhost:8000/health/db
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
