name: Backend integration tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aletheia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aletheia_test
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_QR_NONCE_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Record test environment
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/commit.txt
          python --version > test-results/python-version.txt
          python -m pip freeze > test-results/packages.txt
          docker version > test-results/docker-version.txt
          docker exec "${{ job.services.postgres.id }}" postgres --version > test-results/postgres-version.txt
          docker exec "${{ job.services.redis.id }}" redis-server --version > test-results/redis-version.txt
      - name: Run automated tests
        run: |
          set -o pipefail
          python -m pytest -q --cov --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml:test-results/coverage.xml --cov-report=html:test-results/htmlcov --cov-report=json:test-results/coverage.json --junitxml=test-results/pytest.xml 2>&1 | tee test-results/pytest.log
      - name: Run live HTTP OIDC smoke test
        run: |
          set -o pipefail
          python tests/smoke_oidc.py 2>&1 | tee test-results/smoke-oidc.log
      - name: Run live HTTP QR verification smoke test
        run: |
          set -o pipefail
          python tests/smoke_qr_verification.py 2>&1 | tee test-results/smoke-qr-verification.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  compose:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: aletheia-ci
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: |
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/health/db
          curl --fail http://localhost:8000/health/redis
          docker compose exec -T backend python -m redis_connection
          docker compose exec -T backend python -m alembic current
          docker compose exec -T backend python -m alembic check
      - name: Verify browser session against running Backend
        run: |
          docker compose exec -T backend python - <<'PY'
          import asyncio
          import base64
          import hashlib
          import httpx
          from urllib.parse import parse_qs, urlsplit
          from fastapi import HTTPException
          from sqlalchemy.orm import Session
          from auth.session import COOKIE_NAME, SessionSettings, create_session, revoke_session
          from database import create_database_engine
          from models import Affiliation, SSOClient, User
          from sso.authorization import consume_code
          from sso.clients import verify_client_secret
          from redis_connection import create_redis_client

          async def provision(user_id):
              client = create_redis_client()
              try:
                  return await create_session(client, user_id, SessionSettings.from_environment())
              finally:
                  await client.aclose()

          async def revoke(token):
              client = create_redis_client()
              try:
                  await revoke_session(client, token)
              finally:
                  await client.aclose()

          async def exchange(code, client_id, uri, verifier):
              client = create_redis_client()
              try:
                  return await consume_code(client, code, client_id, uri, verifier)
              finally:
                  await client.aclose()

          engine = create_database_engine()
          token = None
          try:
              with Session(engine) as db:
                  user = User(email='session-smoke@example.edu', affiliation=Affiliation.STUDENT, is_admin=True)
                  db.add(user)
                  db.commit()
                  user_id = user.id
              try:
                  token = asyncio.run(provision(user_id))
                  with httpx.Client(base_url='http://localhost:8000') as client:
                      client.cookies.set(COOKIE_NAME, token)
                      response = client.get('/auth/me')
                      assert response.status_code == 200
                      assert response.json()['user']['id'] == str(user_id)
                      assert client.get('/api/v1/admin/me').status_code == 200
                      created = client.post('/api/v1/admin/clients', headers={'Origin': 'http://localhost:8000'}, json={
                          'name': 'SSO smoke', 'client_type': 'confidential', 'trust_level': 'first_party',
                          'redirect_uris': ['https://consumer.example/callback'], 'allowed_scopes': ['openid'],
                      })
                      assert created.status_code == 201
                      registered = created.json()
                      with Session(engine) as db:
                          assert verify_client_secret(db.get(SSOClient, registered['client_id']), registered['client_secret'])
                      verifier = 'v' * 64
                      challenge = base64.urlsafe_b64encode(hashlib.sha256(verifier.encode('ascii')).digest()).rstrip(b'=').decode()
                      authorized = client.get('/authorize', params={
                          'response_type': 'code', 'client_id': registered['client_id'],
                          'redirect_uri': 'https://consumer.example/callback', 'scope': 'openid', 'state': 'ci-state',
                          'code_challenge': challenge, 'code_challenge_method': 'S256',
                      }, follow_redirects=False)
                      assert authorized.status_code == 302
                      query = parse_qs(urlsplit(authorized.headers['location']).query)
                      assert query['state'] == ['ci-state']
                      grant = asyncio.run(exchange(query['code'][0], registered['client_id'], 'https://consumer.example/callback', verifier))
                      assert grant['user_id'] == str(user_id)
                      try:
                          asyncio.run(exchange(query['code'][0], registered['client_id'], 'https://consumer.example/callback', verifier))
                      except HTTPException as error:
                          assert error.status_code == 400
                      else:
                          raise AssertionError('Authorization code replay was accepted')
                      auth2 = client.get('/authorize', params={
                          'response_type': 'code', 'client_id': registered['client_id'],
                          'redirect_uri': 'https://consumer.example/callback', 'scope': 'openid', 'state': 'ci-state-2',
                          'code_challenge': challenge, 'code_challenge_method': 'S256',
                      }, follow_redirects=False)
                      q2 = parse_qs(urlsplit(auth2.headers['location']).query)
                      token_res = client.post('/token', data={
                          'grant_type': 'authorization_code', 'code': q2['code'][0],
                          'redirect_uri': 'https://consumer.example/callback', 'code_verifier': verifier,
                          'client_id': registered['client_id'], 'client_secret': registered['client_secret'],
                      }, headers={'Content-Type': 'application/x-www-form-urlencoded'})
                      assert token_res.status_code == 503
                      assert token_res.json()['error'] == 'temporarily_unavailable'
                      assert client.delete('/api/v1/admin/clients/' + registered['client_id'], headers={'Origin': 'http://localhost:8000'}).status_code == 204
                      response = client.post('/auth/logout', headers={'Origin': 'http://localhost:8000'})
                      assert response.status_code == 204
                      client.cookies.clear()
                      client.cookies.set(COOKIE_NAME, token)
                      assert client.get('/auth/me').status_code == 401
                  print('Admin, Client management, authorization code and Session checks passed')
              finally:
                  if token:
                      asyncio.run(revoke(token))
                  with Session(engine) as db:
                      db.delete(db.get(User, user_id))
                      db.commit()
          finally:
              engine.dispose()
          PY
      - name: Verify database outage readiness
        run: |
          docker compose stop db
          test "$(curl -s -o /tmp/readiness.json -w '%{http_code}' http://localhost:8000/health/db)" = "503"
          curl --fail http://localhost:8000/health
          docker compose up -d --wait --wait-timeout 180
      - name: Verify Redis outage and recovery
        run: |
          docker compose exec -T redis redis-cli SET ci:transient-check temporary EX 60
          docker compose stop redis
          test "$(curl -s -o /tmp/redis-readiness.json -w '%{http_code}' http://localhost:8000/health/redis)" = "503"
          curl --fail http://localhost:8000/health
          docker compose up -d --wait --wait-timeout 180
          test "$(docker compose exec -T redis redis-cli EXISTS ci:transient-check)" = "0"
          curl --fail http://localhost:8000/health/redis
      - name: Verify persistent database volume
        run: |
          docker compose exec -T db psql -U aletheia -d aletheia -v ON_ERROR_STOP=1 -c "CREATE TABLE compose_smoke (value integer); INSERT INTO compose_smoke VALUES (42);"
          docker compose down
          docker compose up -d --wait --wait-timeout 180
          test "$(docker compose exec -T db psql -U aletheia -d aletheia -Atc 'SELECT value FROM compose_smoke')" = "42"
          curl --fail http://localhost:8000/health/db
      - if: failure()
        run: docker compose logs
      - name: Collect Compose evidence
        if: always()
        run: |
          mkdir -p compose-results
          git rev-parse HEAD > compose-results/commit.txt
          docker version > compose-results/docker-version.txt
          docker compose version > compose-results/compose-version.txt
          docker compose ps --all > compose-results/services.txt
          docker compose logs --no-color > compose-results/services.log 2>&1
      - name: Upload Compose evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: compose-results/
          if-no-files-found: warn
          retention-days: 30
      - if: always()
        run: docker compose down -v
