services:
  backend:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_HOSTED_DOMAIN: ${GOOGLE_HOSTED_DOMAIN:-}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_PUBLIC_ORIGIN: ${SESSION_PUBLIC_ORIGIN:-}
      AUTHORIZATION_CODE_TTL_SECONDS: ${AUTHORIZATION_CODE_TTL_SECONDS:-120}
      SSO_ISSUER: ${SSO_ISSUER:-}
      SSO_ACCESS_AUDIENCE: ${SSO_ACCESS_AUDIENCE:-}
      SSO_ACCESS_TOKEN_TTL_SECONDS: ${SSO_ACCESS_TOKEN_TTL_SECONDS:-300}
      SSO_ID_TOKEN_TTL_SECONDS: ${SSO_ID_TOKEN_TTL_SECONDS:-300}
      SIGNING_KEYS_FILE: ${SIGNING_KEYS_FILE:-}
      QR_TOKEN_TTL_SECONDS: ${QR_TOKEN_TTL_SECONDS:-600}
      QR_NONCE_TTL_SECONDS: ${QR_NONCE_TTL_SECONDS:-300}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/db', timeout=5); urllib.request.urlopen('http://localhost:8000/health/redis', timeout=5)"]
      interval: 10s
      timeout: 12s
      retries: 5
      start_period: 15s

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
